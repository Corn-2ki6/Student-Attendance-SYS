services:
  mysql:
    image: mysql:8.4
    container_name: student-attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: student_attendance
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: attendance_password
    ports:
      - "3307:3306"
    volumes:
      - student_attendance_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  student_attendance_data:
