services:
  mysql:
    image: mysql:8.4
    container_name: student-attendance-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: student_attendance
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: attendance_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: